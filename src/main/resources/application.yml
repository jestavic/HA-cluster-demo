spring:
  application:
    name: ha-cluster-demo

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hacluster}
    username: ${DB_USER:hauser}
    password: ${DB_PASS:hapassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: ha:session
    timeout: 30m

  thymeleaf:
    cache: false
    mode: HTML

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Instance identification
app:
  instance:
    id: ${INSTANCE_ID:local-dev}
  version: "1.0.0"

# Actuator health endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: HA Cluster Demo
    version: "@project.version@"
    instance: ${INSTANCE_ID:local-dev}

logging:
  level:
    com.hacluster: DEBUG
    org.springframework.session: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [Instance:${INSTANCE_ID:local-dev}] %logger{36} - %msg%n"
