<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <span class="brand-icon">⬡</span>
            <span class="brand-text">HA<span class="brand-accent">Cluster</span></span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/architecture"><i class="bi bi-diagram-3 me-1"></i>Architecture</a></li>
                <li class="nav-item"><a class="nav-link" href="/cluster-status"><i class="bi bi-activity me-1"></i>Cluster Status</a></li>
                <li class="nav-item"><a class="nav-link" href="/simulate"><i class="bi bi-shuffle me-1"></i>Simulate</a></li>
                <li class="nav-item"><a class="nav-link" href="/failover"><i class="bi bi-shield-check me-1"></i>Failover</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/monitor"><i class="bi bi-cpu me-1"></i>Monitor</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/notes"><i class="bi bi-journal-text me-1"></i>Cluster Notes</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-center">
                <li class="nav-item me-2">
                    <span class="instance-badge" th:text="'⬡ ' + ${instanceId}">⬡ node</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>
                            <span sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item text-danger" type="submit">
                                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-sm btn-primary" href="/login">
                        <i class="bi bi-lock me-1"></i>Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer mt-5">
    <div class="container-fluid px-4">
        <div class="row align-items-center">
            <div class="col-md-6">
                <span class="footer-brand">⬡ HACluster</span>
                <span class="text-muted ms-2 small">High Availability Cluster System — College Project</span>
            </div>
            <div class="col-md-6 text-md-end">
                <span class="node-tag me-3" th:text="'Node: ' + ${instanceId}">Node: local</span>
                <span class="node-tag" th:text="'Port: ' + ${serverPort}">Port: 8080</span>
            </div>
        </div>
    </div>
</footer>

<th:block th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</th:block>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</th:block>
</body>
</html>
