<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block th:insert="~{fragments/common :: head}"></th:block>
    <title>Login — HA Cluster Demo</title>
</head>
<body class="login-page">

<div th:insert="~{fragments/common :: navbar}"></div>

<div class="container" style="padding-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">⬡</div>
                    <h3>Cluster Login</h3>
                    <p class="text-muted small">Authenticate to access the cluster dashboard</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>Invalid username or password.</div>
                </div>
                <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div>Logged out successfully.</div>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="username" name="username" class="form-control"
                                   placeholder="student or admin" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control"
                                   placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>

                <div class="login-demo-creds mt-4">
                    <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i>Demo credentials:</p>
                    <div class="cred-row"><code>student</code> / <code>demo123</code> <span class="badge bg-secondary ms-2">USER</span></div>
                    <div class="cred-row mt-1"><code>admin</code> / <code>admin123</code> <span class="badge bg-warning text-dark ms-2">ADMIN</span></div>
                </div>

                <div class="login-node-info mt-4">
                    <i class="bi bi-server me-1"></i>
                    Node: <strong th:text="${instanceId}">node-1</strong> &nbsp;|&nbsp; Port: <strong th:text="${serverPort}">8080</strong>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/common :: footer}"></div>
<div th:insert="~{fragments/common :: scripts}"></div>
</body>
</html>
