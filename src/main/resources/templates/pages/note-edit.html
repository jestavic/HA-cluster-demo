<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block th:insert="~{fragments/common :: head}"></th:block>
    <title>Edit Note — HA Cluster Demo</title>
</head>
<body>
<div th:insert="~{fragments/common :: navbar}"></div>

<div class="page-header">
    <div class="container py-4">
        <h1 class="page-title"><i class="bi bi-pencil-square me-2"></i>Edit Cluster Note</h1>
        <p class="page-subtitle">Changes saved to the shared PostgreSQL database</p>
    </div>
</div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="info-card">
                <form th:action="@{/notes/edit/{id}(id=${note.id})}" method="post" th:object="${note}">
                    <div class="mb-3">
                        <label class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Content <span class="text-danger">*</span></label>
                        <textarea th:field="*{content}" class="form-control"
                                  th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                  rows="6"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                    </div>
                    <div class="alert alert-secondary small mb-3">
                        <i class="bi bi-info-circle me-1"></i>
                        This update will be tagged to: <strong th:text="${instanceId}">node-1</strong>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Update Note</button>
                        <a href="/notes" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-2"></i>Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/common :: footer}"></div>
<div th:insert="~{fragments/common :: scripts}"></div>
</body>
</html>
